name: Sync ESPN Results

on:
  schedule:
    # Every 10 minutes during the World Cup (Jun 12 – Jul 19 2026)
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call auto-sync endpoint
        run: |
          RESPONSE=$(curl -s -L -w "\n%{http_code}" -X POST "${{ secrets.APP_URL }}/api/admin/sync/auto" \
            -H "Content-Type: application/json" \
            -d "{\"adminKey\":\"${{ secrets.ADMIN_KEY }}\"}")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Sync failed with status $HTTP_STATUS"
            exit 1
          fi

          UPDATED=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('updated',0))")
          echo "Updated: $UPDATED result(s)"

          if [ "$UPDATED" != "0" ]; then
            echo "::notice::$UPDATED result(s) synced from ESPN"
            CHANGES=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(' -', c) for c in d.get('changes',[])]")
            echo "$CHANGES"
          fi
