<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option 3: Dark navy — neon flat soccer ball + bright text -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Subtle glow ring behind ball -->
  <circle cx="256" cy="210" r="175" fill="#1E3A1E" opacity="0.8"/>

  <!-- Ball base -->
  <circle cx="256" cy="210" r="158" fill="#22C55E"/>

  <!-- Flat white pentagon patches -->
  <!-- Top center -->
  <polygon points="256,74 289,97 277,133 235,133 223,97" fill="#FFFFFF"/>
  <!-- Upper-left -->
  <polygon points="160,110 192,92 210,128 190,159 156,148" fill="#FFFFFF"/>
  <!-- Upper-right -->
  <polygon points="352,110 320,92 302,128 322,159 356,148" fill="#FFFFFF"/>
  <!-- Left -->
  <polygon points="116,225 138,191 173,203 175,243 146,265" fill="#FFFFFF"/>
  <!-- Right -->
  <polygon points="396,225 374,191 339,203 337,243 366,265" fill="#FFFFFF"/>
  <!-- Lower-left -->
  <polygon points="162,316 176,280 213,284 219,324 191,342" fill="#FFFFFF"/>
  <!-- Lower-right -->
  <polygon points="350,316 336,280 299,284 293,324 321,342" fill="#FFFFFF"/>

  <!-- Dark seam lines between patches (thin) -->
  <circle cx="256" cy="210" r="158" fill="none" stroke="#0F172A" stroke-width="3"/>

  <!-- BOLÃO text -->
  <text x="256" y="440"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="90" font-weight="900"
        fill="#FACC15" text-anchor="middle" letter-spacing="3">BOLÃO</text>

  <!-- DA COPA -->
  <text x="256" y="490"
        font-family="Impact, 'Arial Black', sans-serif"
        font-size="40" font-weight="900"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="8">DA COPA</text>
</svg>
