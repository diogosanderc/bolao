<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option 5: Brazil green — white trophy + yellow bold text -->
  <rect width="512" height="512" rx="112" fill="#15803D"/>

