<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Option 6: Gold background — dark green trophy + black sport text -->
  <rect width="512" height="512" rx="112" fill="#FBBF24"/>

  <!-- Bottom darker band -->
  <rect x="0" y="390" width="512" height="122" rx="0" fill="#F59E0B"/>
  <rect x="0" y="390" width="512" height="122" rx="112" fill="#F59E0B"/>

  <!-- Thin dark green divider line -->
  <rect x="0" y="388" width="512" height="5" fill="#14532D"/>

  <!-- === WC TROPHY in dark green === -->
  <!-- Globe -->
  <circle cx="256" cy="138" r="56" fill="#14532D"/>
  <!-- Globe latitude/longitude lines in lighter green -->
  <ellipse cx="256" cy="138" rx="28" ry="56" fill="none" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="200" y1="138" x2="312" y2="138" stroke="#16A34A" stroke-width="2.5"/>
  <line x1="205" y1="113" x2="307" y2="113" stroke="#16A34A" stroke-width="1.5"/>
  <line x1="205" y1="163" x2="307" y2="163" stroke="#16A34A" stroke-width="1.5"/>
  <!-- White rim -->
  <circle cx="256" cy="138" r="56" fill="none" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Trophy body (dark green) -->
  <path d="
    M 222,190
    C 178,206 140,240 148,268
    C 156,296 188,306 216,318
    L 214,348
    L 298,348
    L 296,318
    C 324,306 356,296 364,268
    C 372,240 334,206 290,190
    Z
  " fill="#14532D"/>
  <!-- Highlight stripe down center -->
  <path d="M 248,194 C 246,240 246,300 248,348 L 264,348 C 266,300 266,240 264,194 Z"
        fill="#16A34A" opacity="0.45"/>

  <!-- Stem -->
  <rect x="229" y="348" width="54" height="36" rx="3" fill="#14532D"/>
  <!-- Base 1 -->
  <rect x="195" y="384" width="122" height="20" rx="4" fill="#14532D"/>
  <!-- Base 2 (wider) -->
  <rect x="174" y="387" width="164" height="10" rx="4" fill="#0F3D16" opacity="0.4"/>

  <!-- BOLÃO — huge bold black -->
  <text x="256" y="462"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="98" fill="#14532D"
        text-anchor="middle" letter-spacing="1">BOLÃO</text>

  <!-- DA COPA in white on dark band -->
  <text x="256" y="500"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-size="42" fill="#FFFFFF"
        text-anchor="middle" letter-spacing="8">DA COPA</text>
</svg>
