<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="bg"><rect width="512" height="512" rx="108"/></clipPath>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0.3" y1="0.1" x2="0.7" y2="0.9">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#grad)"/>
  <g clip-path="url(#bg)">

    <!-- Background decorative circles -->
    <circle cx="60"  cy="60"  r="90"  fill="#ffffff" opacity="0.05"/>
    <circle cx="460" cy="440" r="120" fill="#ffffff" opacity="0.05"/>
    <circle cx="440" cy="80"  r="60"  fill="#ffffff" opacity="0.05"/>

    <!-- Confetti dots -->
    <circle cx="68"  cy="180" r="9"  fill="#FCD34D"/>
    <circle cx="108" cy="390" r="7"  fill="#34D399"/>
    <circle cx="54"  cy="320" r="6"  fill="#F87171"/>
    <circle cx="440" cy="190" r="8"  fill="#FCD34D"/>
    <circle cx="460" cy="310" r="10" fill="#34D399"/>
    <circle cx="420" cy="370" r="6"  fill="#F87171"/>
    <circle cx="150" cy="68"  r="7"  fill="#F87171"/>
    <circle cx="360" cy="58"  r="9"  fill="#34D399"/>
    <circle cx="88"  cy="440" r="8"  fill="#93C5FD"/>
    <circle cx="430" cy="460" r="7"  fill="#FCD34D"/>

    <!-- Stars -->
    <polygon points="90,260 94,273 108,273 97,281 101,294 90,286 79,294 83,281 72,273 86,273" fill="#FCD34D"/>
    <polygon points="420,260 424,273 438,273 427,281 431,294 420,286 409,294 413,281 402,273 416,273" fill="#FCD34D"/>
    <polygon points="188,44 191,53 200,53 193,58 196,67 188,62 180,67 183,58 176,53 185,53" fill="#FCD34D"/>
    <polygon points="324,44 327,53 336,53 329,58 332,67 324,62 316,67 319,58 312,53 321,53" fill="#FCD34D"/>

    <!-- Soccer ball -->
    <circle cx="256" cy="300" r="148" fill="url(#ballGrad)" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Ball patches (simplified flat pentagons) -->
    <!-- Center patch -->
    <polygon points="256,200 282,218 272,248 240,248 230,218" fill="#1e293b"/>
    <!-- Top-left -->
    <polygon points="211,172 237,190 228,220 196,220 186,190" fill="#1e293b" transform="rotate(-38,219,196)"/>
    <!-- Top-right -->
    <polygon points="280,163 306,181 297,211 265,211 255,181" fill="#1e293b" transform="rotate(38,281,187)"/>
    <!-- Left -->
    <polygon points="168,262 194,280 185,310 153,310 143,280" fill="#1e293b" transform="rotate(-18,168,286)"/>
    <!-- Right -->
    <polygon points="316,262 342,280 333,310 301,310 291,280" fill="#1e293b" transform="rotate(18,317,286)"/>
    <!-- Bottom-left -->
    <polygon points="196,348 222,366 213,396 181,396 171,366" fill="#1e293b" transform="rotate(20,197,372)"/>
    <!-- Bottom-right -->
    <polygon points="288,348 314,366 305,396 273,396 263,366" fill="#1e293b" transform="rotate(-20,289,372)"/>

    <!-- Trophy -->
    <!-- Cup bowl -->
    <path d="M198 80 L314 80 L314 180 Q314 228 256 242 Q198 228 198 180 Z" fill="url(#trophyGrad)"/>
    <!-- Left handle -->
    <path d="M198 104 C168 104 158 126 158 144 C158 168 174 180 198 176"
          fill="none" stroke="#F59E0B" stroke-width="20" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M314 104 C344 104 354 126 354 144 C354 168 338 180 314 176"
          fill="none" stroke="#F59E0B" stroke-width="20" stroke-linecap="round"/>
    <!-- Cup inner shine -->
    <path d="M218 90 L294 90 L294 170 Q294 206 256 216 Q234 210 224 196 Q218 182 218 168 Z"
          fill="#FDE68A" opacity="0.45"/>
    <!-- Stem -->
    <rect x="240" y="242" width="32" height="32" rx="4" fill="#F59E0B"/>
    <!-- Base -->
    <rect x="204" y="272" width="104" height="22" rx="6" fill="#F59E0B"/>
    <rect x="204" y="283" width="104" height="11" rx="6" fill="#D97706"/>

    <!-- Trophy stars -->
    <polygon points="256,52 261,67 277,67 264,76 269,91 256,82 243,91 248,76 235,67 251,67" fill="#FDE68A"/>

  </g>
</svg>
