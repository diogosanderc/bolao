<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="bg"><rect width="512" height="512" rx="108"/></clipPath>
    <clipPath id="shield">
      <path d="M256 492 Q88 412 68 284 L56 130 Q56 70 122 70 L256 70 L390 70 Q456 70 456 130 L444 284 Q424 412 256 492 Z"/>
    </clipPath>
  </defs>

  <!-- White rounded background -->
  <rect width="512" height="512" rx="108" fill="#FFFFFF"/>

  <g clip-path="url(#bg)">
    <!-- Shield fill -->
    <path d="M256 492 Q88 412 68 284 L56 130 Q56 70 122 70 L256 70 L390 70 Q456 70 456 130 L444 284 Q424 412 256 492 Z"
          fill="#1E9444"/>

    <!-- Vertical stripes clipped to shield -->
    <g clip-path="url(#shield)">
      <rect x="56"  y="70" width="44" height="450" fill="#188038"/>
      <rect x="144" y="70" width="44" height="450" fill="#188038"/>
      <rect x="232" y="70" width="44" height="450" fill="#188038"/>
      <rect x="320" y="70" width="44" height="450" fill="#188038"/>
      <rect x="408" y="70" width="44" height="450" fill="#188038"/>
    </g>

    <!-- Yellow outer border -->
    <path d="M256 492 Q88 412 68 284 L56 130 Q56 70 122 70 L256 70 L390 70 Q456 70 456 130 L444 284 Q424 412 256 492 Z"
          fill="none" stroke="#F5C518" stroke-width="14"/>

    <!-- Yellow inner border -->
    <path d="M256 464 Q108 392 90 278 L80 140 Q80 98 136 98 L256 98 L376 98 Q432 98 432 140 L422 278 Q404 392 256 464 Z"
          fill="none" stroke="#F5C518" stroke-width="5.5"/>

    <!-- BOLÃO text - Impact style, inside shield -->
    <text x="256" y="310"
          font-family="Impact, 'Arial Narrow', Arial, sans-serif"
          font-size="108" fill="#F0EAD2"
          text-anchor="middle" letter-spacing="4">BOLÃO</text>

    <!-- Decorative dashes flanking DA COPA -->
    <rect x="76"  y="345" width="50" height="9" rx="4.5" fill="#F5C518"/>
    <rect x="386" y="345" width="50" height="9" rx="4.5" fill="#F5C518"/>

    <!-- DA COPA text -->
    <text x="256" y="380"
          font-family="Impact, 'Arial Narrow', Arial, sans-serif"
          font-size="52" fill="#F5C518"
          text-anchor="middle" letter-spacing="6">DA COPA</text>
  </g>

  <!--
    Classic soccer ball (Telstar-style) centered at (256, 108), radius 80
    White base + 7 black pentagon patches arranged in traditional pattern
  -->
  <!-- White base circle -->
  <circle cx="256" cy="108" r="80" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="2"/>

  <!-- Black pentagon patches -->
  <!-- Top-center pentagon -->
  <polygon points="256,34 280,51 271,77 241,77 232,51" fill="#111111"/>
  <!-- Upper-left pentagon -->
  <polygon points="197,56 218,46 230,71 212,87 190,77" fill="#111111"/>
  <!-- Upper-right pentagon -->
  <polygon points="315,56 294,46 282,71 300,87 322,77" fill="#111111"/>
  <!-- Left pentagon -->
  <polygon points="179,116 190,93 213,96 219,122 200,137" fill="#111111"/>
  <!-- Right pentagon -->
  <polygon points="333,116 322,93 299,96 293,122 312,137" fill="#111111"/>
  <!-- Lower-left pentagon -->
  <polygon points="204,159 218,138 242,147 240,172 218,177" fill="#111111"/>
  <!-- Lower-right pentagon -->
  <polygon points="308,159 294,138 270,147 272,172 294,177" fill="#111111"/>

  <!-- Seam lines connecting patches (thin white lines over the ball perimeter feel) -->
  <!-- We skip seam lines — patches alone read clearly at icon size -->
</svg>
