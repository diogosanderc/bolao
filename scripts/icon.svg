<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="bg">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
  </defs>

  <!-- Background black -->
  <rect width="512" height="512" rx="100" fill="#000000"/>

  <g clip-path="url(#bg)">
    <!-- "26" numerals — bold, white, filling the frame -->
    <text x="138" y="400"
          font-family="Arial Black, Arial, sans-serif"
          font-weight="900" font-size="320"
          fill="white" text-anchor="middle">2</text>
    <text x="374" y="400"
          font-family="Arial Black, Arial, sans-serif"
          font-weight="900" font-size="320"
          fill="white" text-anchor="middle">6</text>

    <!-- Flat trophy centered, overlapping the gap between 2 and 6 -->
    <!-- Cup bowl -->
    <path d="M206 68 L306 68 L306 180 Q306 228 256 240 Q206 228 206 180 Z" fill="#FFB81C"/>
    <!-- Left handle -->
    <path d="M206 92 C176 92 166 116 166 134 C166 158 182 170 206 166"
          fill="none" stroke="#FFB81C" stroke-width="18" stroke-linecap="round"/>
    <!-- Right handle -->
    <path d="M306 92 C336 92 346 116 346 134 C346 158 330 170 306 166"
          fill="none" stroke="#FFB81C" stroke-width="18" stroke-linecap="round"/>
    <!-- Inner highlight (flat) -->
    <path d="M224 78 L288 78 L288 168 Q288 208 256 218 Q238 212 230 200 Q224 188 224 174 Z"
          fill="#FFC93C" opacity="0.28"/>
    <!-- Stem -->
    <rect x="242" y="240" width="28" height="30" rx="3" fill="#FFB81C"/>
    <!-- Base -->
    <rect x="210" y="268" width="92" height="18" rx="5" fill="#FFB81C"/>
    <!-- Base shade -->
    <rect x="210" y="278" width="92" height="8" rx="5" fill="#E6A010"/>

    <!-- FIFA label -->
    <text x="256" y="450"
          font-family="Arial, sans-serif"
          font-weight="700" font-size="46"
          fill="white" text-anchor="middle" letter-spacing="10">FIFA</text>
  </g>
</svg>
